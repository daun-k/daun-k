name: Update Readme

on:
  schedule:
    - cron: "53 3 * * *" # best to run at random time of day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Update:
    name: Update Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 2
      - uses: mahyarmirrashed/action-github-readme-stats@main # v1.0 and other tags exist, as well
        with:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          TIMEZONE: "Asia/Seoul"
          FEATURES: "DAY_STATS"
      - name: "Commit changes"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          if [ "$(git log -1 --format=%an)" = "github-actions[bot]" ]; then
            git commit --amend -m "chore: update readme via actions"
            git push --force
          else
            git commit -m "chore: update readme via actions"
            git push
          fi
