name: Update Readme

on:
  schedule:
    - cron: "1 3 * * *"
  workflow_dispatch:

jobs:
  Update:
    name: Update Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: mahyarmirrashed/action-github-readme-stats@main
        with:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          TIMEZONE: "Asia/Seoul"
          FEATURES: "DAY_STATS,WEEK_STATS"
      # 이후 README 변경분을 커밋하는 단계가 필요합니다
